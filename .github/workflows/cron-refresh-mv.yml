name: Cron — Refresh materialized views

on:
  schedule:
    # Every 17 minutes — off the :00/:30 stampede.
    - cron: '*/17 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call refresh endpoint
        run: |
          curl -sS -X POST "https://masjidmu-backend.onrender.com/api/jobs/refresh-mv" \
            -H "Authorization: Bearer ${{ secrets.JOBS_INTERNAL_TOKEN }}" \
            -H "content-type: application/json" \
            --max-time 60 \
            -w "\nHTTP %{http_code}" \
            | tee /tmp/response.txt && \
            code=$(tail -1 /tmp/response.txt | awk '{print $2}') && \
            if [ "$code" -ge 400 ]; then echo "❌ HTTP $code"; head -1 /tmp/response.txt; exit 1; fi
